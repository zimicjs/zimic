openapi: 3.1.0

info:
  title: Binary Bodies
  version: 1.0.0

paths:
  /binary-upload:
    post:
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              description: The file to upload
              format: binary
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                description: The file uploaded
                format: binary
                nullable: true

  /binary-component:
    get:
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/File'

components:
  schemas:
    File:
      type: string
      format: binary
