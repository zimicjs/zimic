openapi: 3.1.0

info:
  title: Enums
  version: 1.0.0

paths:
  /errors:
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /statuses:
    get:
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  nullableKeyword:
                    type: string
                    nullable: true
                    enum:
                      - active
                      - inactive
                  nullableTypeList:
                    type:
                      - string
                      - 'null'
                    enum:
                      - active
                      - inactive

components:
  schemas:
    Error:
      type: object
      enum:
        - code: 1
          message: Not found
        - code: 2
          message: Conflict
