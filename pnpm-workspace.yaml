  compression@1: ^1.8.2

  dompurify@3: ^3.4.16

  esbuild@0: ^0.28.1

  fast-uri@3: ^3.1.9

  follow-redirects@1: ^1.16.1

  form-data@4: ^4.0.6

  glob@7: ^10.5.0
  glob@8: ^10.5.0
  glob@9: ^10.5.0
  glob@10: ^10.5.0

  lodash@4: ^4.17.23

