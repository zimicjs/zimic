minimumReleaseAge: 1440 # 1 day in minutes
autoInstallPeers: true
engineStrict: false
sideEffectsCache: false
ignoreWorkspaceCycles: true
linkWorkspacePackages: true
verifyDepsBeforeRun: false

minimumReleaseAgeExclude:
  - '@zimic/*'

packages:
  - apps/*
  - packages/*
  - examples
  - examples/*
  - docs/*

