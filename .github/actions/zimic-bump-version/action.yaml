name: Bump Zimic Version
description: Bump the version of a Zimic project.

inputs:
  project-name:
    description: Project name
    required: true
  project-directory:
    description: Project directory
    required: true
  upgrade-type:
    description: Upgrade type
    required: true
  pre-release-id:
    description: Pre-release id
    required: false
  commit-user-name:
    description: Commit user name
    required: true
  commit-user-email:
    description: Commit user email
    required: true

outputs:
  value:
    description: Bumped version
    value: ${{ steps.bump-version.outputs.value }}
  commit-sha:
    description: Release commit SHA
    value: ${{ steps.bump-version.outputs.commit-sha }}

runs:
  using: composite
  steps:
    - name: Bump version
      id: bump-version
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      run: |
        projectName=${{ inputs.project-name }}
        upgradeType=${{ inputs.upgrade-type }}
        preReleaseId=${{ inputs.pre-release-id }}

        echo 'Bumping version...'

        currentVersion=$(jq '.version' -r package.json)
        stableCurrentVersion=$(echo "$currentVersion" | sed 's/-.*//')

        if [[ "$upgradeType" == 'stable' ]]; then
          pnpm version "$stableCurrentVersion" --no-git-tag-version
        elif [[ "$preReleaseId" == 'none' ]]; then
          pnpm version "$upgradeType" --no-git-tag-version
        else
          pnpm version "pre${upgradeType#*pre}" --preid "$preReleaseId" --no-git-tag-version
        fi

        bumpedVersion=$(jq '.version' -r package.json)

        echo "Project '$projectName' is now at $bumpedVersion"
        echo 'Committing changes...'

        git config user.name '${{ inputs.commit-user-name }}'
        git config user.email '${{ inputs.commit-user-email }}'

        git add package.json
        git commit -m "chore(release): $projectName@$bumpedVersion"

        echo 'Pushing changes...'

        numberOfPushRetries=0
        maxNumberOfPushRetries=5

        git config pull.rebase true

        until git push --set-upstream origin HEAD --no-verify; do
          if [[ $numberOfPushRetries -gt $maxNumberOfPushRetries ]]; then
            echo "Push failed after $maxNumberOfPushRetries retries. Aborting."
            exit 1
          fi

          numberOfPushRetries=$((numberOfPushRetries + 1))

          echo 'Push failed.'

          if git diff --quiet; then
            echo 'No unstaged changes.'
          else
            echo 'Stashing unstaged changes...'
            git stash --include-untracked
            git stash drop
          fi

          echo 'Syncing local branch with remote...'
          git pull
        done

        echo "value=$bumpedVersion" >> $GITHUB_OUTPUT
        echo "commit-sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

        if [[ "$upgradeType" == 'stable' || "$preReleaseId" == 'none' ]]; then
          currentBranch=$(git branch --show-current)

          for branch in main canary; do
            if [[ "$branch" == "$currentBranch" ]]; then
              continue
            fi

            echo "Syncing branch '$branch'..."

            git checkout $branch

            while true; do
              if ! git merge - --no-ff --no-edit; then
                # A release branch built from a selection of canary changes, instead of from canary itself, changes
                # the version line from an older base than this branch. Resolve only that conflict, keeping the
                # released version, and fail on any other.
                if [[ "$(git diff --name-only --diff-filter=U)" != '${{ inputs.project-directory }}/package.json' ]]; then
                  echo "Merge into '$branch' has conflicts other than the project version. Aborting."
                  exit 1
                fi

                echo 'Resolving the project version conflict...'
                git merge --abort
                git merge - --no-ff --no-edit -X ours
                npm pkg set version="$bumpedVersion"
                git add package.json
                git commit --amend --no-edit
              fi

              if git push --set-upstream origin $branch --no-verify; then
                echo "Branch '$branch' synced successfully."
                break
              fi

              if [[ $numberOfPushRetries -gt $maxNumberOfPushRetries ]]; then
                echo "Push failed after $maxNumberOfPushRetries retries. Aborting."
                exit 1
              fi

              numberOfPushRetries=$((numberOfPushRetries + 1))

              echo 'Push failed.'

              echo 'Undoing merge commit...'
              git reset HEAD~1

              if git diff --quiet; then
                echo 'No unstaged changes.'
              else
                echo 'Stashing unstaged changes...'
                git stash --include-untracked
                git stash drop
              fi

              echo 'Syncing local branch with remote...'
              git pull
            done

            git checkout -
          done
        fi
