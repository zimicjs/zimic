name: Zimic Release NPM
description: Release a Zimic project on NPM.

inputs:
  ref-name:
    description: The Git reference name to release
    required: true
  project-name:
    description: The project name to release
    required: true
  project-directory:
    description: The project directory to release
    required: true

outputs:
  version-value:
    description: The version of the released package
    value: ${{ steps.zimic-version.outputs.value }}
  version-label:
    description: The label of the released package version
    value: ${{ steps.zimic-version.outputs.label }}

runs:
  using: composite
  steps:
    - name: Get ${{ inputs.project-name }} release version
      id: zimic-version
      uses: ./.github/actions/zimic-version
      with:
        project-name: ${{ inputs.project-name }}
        project-directory: ${{ inputs.project-directory }}
        validate-ref-name: ${{ inputs.ref-name }}

    - name: Set up ${{ inputs.project-name }}
      uses: ./.github/actions/zimic-setup
      with:
        node-registry-url: https://registry.npmjs.org
        install: '"@zimic/*..." "${{ inputs.project-name }}..."'
        build: ${{ inputs.project-name }}^...

    - name: Build ${{ inputs.project-name }}
      shell: bash
      run: pnpm turbo build --filter '${{ inputs.project-name }}'

    - name: Release to NPM
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      run: |
        # npm 11.5.1 or later is required for trusted publishing.
        npm install -g npm@11.6.2

        # npm does not replace "workspace:" ranges, so we pack with pnpm and publish the tarball.
        packDirectory="$(mktemp -d)"
        pnpm pack --pack-destination "$packDirectory"
        tarballPath="$(echo "$packDirectory"/*.tgz)"

        packedManifest="$(tar -xzOf "$tarballPath" package/package.json)"

        if grep --quiet '"workspace:' <<< "$packedManifest"; then
          echo 'The packed package.json still has "workspace:" ranges. Something likely went wrong with the packing script and they were not replaced. Aborting the release because package managers may be unable to interpret the versions correctly.' >&2
          exit 1
        fi

        npm publish "$tarballPath" --tag ${{ steps.zimic-version.outputs.label }}
      env:
        NPM_CONFIG_PROVENANCE: true

    - name: Save turbo cache
      if: ${{ always() }}
      uses: actions/cache/save@v6.1.0
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-turbo
