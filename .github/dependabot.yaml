version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '00:00'
    labels:
      - dependencies
    commit-message:
      prefix: chore(root)
    target-branch: canary
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # MSW 3 misses requests on Node connections opened before interception starts.
      - dependency-name: msw
        update-types:
          - version-update:semver-major
      # Blocked by https://github.com/hosseinmd/prettier-plugin-jsdoc/issues/254.
      - dependency-name: prettier-plugin-jsdoc
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # Blocked by https://github.com/jsx-eslint/eslint-plugin-react/issues/3977.
      # Remember to re-enable @typescript-eslint/only-throw-error on packages/eslint-config/index.js after resolved.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
      time: '00:00'
    labels:
      - dependencies
    commit-message:
      prefix: chore(root)
    target-branch: canary
    groups:
      github-actions:
        patterns:
          - '*'
